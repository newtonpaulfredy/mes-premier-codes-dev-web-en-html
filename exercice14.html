<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande De PIZZA en ligne</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Information du client</legend>
            <requiered>
                <p>
                    <br><input type="text" placeholder="nom">

                </p>
            </requiered>
        </fieldset>
        <fieldset>
            <legend>Information sur le produit et la livraison</legend>
            <p>Taille de la pizza
                <br><input type="radio">S

                </select>
                <br>Ingredients

                <br><input type="checkbox">Huile
                <br><input type="checkbox">épices
                <br><input type="checkbox">Tomate
                <br><input type="checkbox">Lait

                <br><input type="checkbox">Condiments vert
                <br>QUANTITE
                <br><input type="number" Min="1" Max="10">
                <br>BOISSONS
                <select>
                <br><option value="">choisir</option>
                <option value="jus d'ananas">jus d'ananas</option>
                <option value="jus de pamplemousse">jus de pamplemousse</option>
                <option value="jus d'orange">jus d'orange</option>
                <option value="jus de pomme">jus de pomme</option>
                <option value="jus de corrossol">jus de corrossol</option>
                <option value="jus de mangue">jus de mangue</option>
                <option value="jus de raisin">jus de raisin</option>
                <option value="jus de drenadine">jus de drenadine</option>
                <option value="cocktail de fruit">cocktail de fruit</option>
                </select>
                <br><textarea>nous vous offrons le meilleur des services a des prix incroyables accéssible a tous commandé et livré instantnnément</textarea>
                <br>MODE DE livraison
                <br><input type="radio">livraison
                <br><input type="radio">Retrait
                <br>Heure souhaité
                <br><input type="time">
            </p>
        </fieldset>
    </form>
</body>

</html>
